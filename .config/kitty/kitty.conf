shell zsh

# ===== FONT =====
font_family      FiraCode Nerd Font
bold_font        FiraCode Nerd Font Bold
italic_font      FiraCode Nerd Font Italic
bold_italic_font FiraCode Nerd Font Bold Italic
font_size 12.0
adjust_line_height 110%
disable_ligatures never
font_features FiraCodeNerdFont-Regular +zero +ss01 +ss02 +ss03 +ss04 +ss05

# ===== TRANSPARENCY / BLUR =====
# 0 = trong suốt hoàn toàn, 1 = không trong suốt
background_opacity 0.96
dynamic_background_opacity yes

# ===== COLORS (Dracula theme, đồng bộ toàn bộ) =====
foreground #f8f8f2
background #282a36
selection_foreground #282a36
selection_background #f8f8f2
cursor #f8f8f2
cursor_text_color background
color0  #21222c
color1  #ff5555
color2  #50fa7b
color3  #f1fa8c
color4  #bd93f9
color5  #ff79c6
color6  #8be9fd
color7  #f8f8f2
color8  #6272a4
color9  #ff6e6e
color10 #69ff94
color11 #ffffa5
color12 #d6acff
color13 #ff92df
color14 #a4ffff
color15 #ffffff

# Viền cửa sổ / split
active_border_color   #bd93f9
inactive_border_color #44475a
bell_border_color     #f1fa8c
window_border_width 1.2pt
draw_minimal_borders yes

# Link
url_color #8be9fd
url_style curly

# ===== CURSOR =====
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_trail 3
cursor_trail_decay 0.1 0.4

# ===== WINDOW =====
window_padding_width 10
single_window_margin_width -1
window_margin_width 4
confirm_os_window_close 0
remember_window_size yes
enable_audio_bell no
scrollback_lines 10000
mouse_hide_wait 3.0
copy_on_select yes

# ===== TABS & SPLITS =====
map ctrl+shift+enter launch --location=hsplit
map ctrl+shift+e launch --location=vsplit
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

# Ctrl+C để copy (nhưng chỉ khi đang ở chế độ chọn)
map ctrl+c copy_to_clipboard

# Ctrl+V để paste
map ctrl+v paste_from_clipboard

# (Tùy chọn) Ctrl+Shift+C / Ctrl+Shift+V vẫn giữ nguyên
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# ----- TAB APPEARANCE -----
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge top
tab_bar_min_tabs 1
tab_bar_align left

active_tab_foreground   #282a36
active_tab_background   #bd93f9
inactive_tab_foreground #6272a4
inactive_tab_background #21222c
tab_bar_background      #191a21

# Chỉ hiện số tab và tên thư mục, không hiện hostname
tab_title_template "{index}: {title}"
# Tự đổi title thành tên thư mục hiện tại
shell_integration enabled

# Font đậm cho tab đang active
active_tab_font_style   bold
inactive_tab_font_style normal

# Padding cho tab
tab_bar_margin_width 10
tab_bar_margin_height 2 0
